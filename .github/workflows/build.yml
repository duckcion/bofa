name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260221
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      COMPARE: 0
      UNUSED_ERROR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Install binutils
        run: |
          sudo apt update
          sudo apt install -y build-essential libpng-dev libelf-dev
        # build-essential and git are already installed
        # gcc-arm-none-eabi is only needed for the modern build
        # as an alternative to dkP

      - name: Patch broken nullptr_t typedef in devkitARM stddef.h
        run: |
          find /opt/devkitpro/devkitARM/lib/gcc/arm-none-eabi -name stddef.h -print -exec sed -i '/typedef __typeof__[[:space:]]*(nullptr) nullptr_t;/d' {} \;

      - name: ROM
        env:
          COMPARE: 0
        run: make -j${nproc} -O all

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-rom
          path: pokeemerald.gba
          if-no-files-found: error